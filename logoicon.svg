<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="PowerUp Kids icon">
  <defs>
    <linearGradient id="pk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0f9b7e"/>
    </linearGradient>
    <linearGradient id="pk-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="192" height="192" rx="46" fill="url(#pk-bg)"/>
  <rect x="4" y="4" width="192" height="192" rx="46" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Bolt: the "power" in PowerUp -->
  <path d="M112,36 L70,114 L94,114 L82,168 L134,84 L106,84 Z"
        fill="url(#pk-bolt)" stroke="url(#pk-bolt)" stroke-width="12"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Star: the "up" — a level-up spark, echoing the app's level-chip star -->
  <polygon points="148.0,39.0 151.6,49.0 162.3,49.4 153.9,55.9 156.8,66.1 148.0,60.2 139.2,66.1 142.1,55.9 133.7,49.4 144.4,49.0"
           fill="#facc15" stroke="#0f172a" stroke-opacity="0.12" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
